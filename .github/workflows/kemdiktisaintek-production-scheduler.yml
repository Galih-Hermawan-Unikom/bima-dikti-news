name: Kemdiktisaintek Production Scheduler

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kemdiktisaintek-production-scheduler
  cancel-in-progress: false

jobs:
  dispatch-poll:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify production gates and dispatch one POLL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEMDIKTISAINTEK_PRODUCTION_SCHEDULER_ENABLED: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_SCHEDULER_ENABLED || 'false' }}
          KEMDIKTISAINTEK_PRODUCTION_ENABLED: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_ENABLED || 'false' }}
          KEMDIKTISAINTEK_PRODUCTION_AUTO_SEND: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_AUTO_SEND || 'false' }}
          KEMDIKTISAINTEK_PRODUCTION_APPROVED_CODE_SHA: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_APPROVED_CODE_SHA || '' }}
        run: python -B kemdiktisaintek_prod_scheduler.py
