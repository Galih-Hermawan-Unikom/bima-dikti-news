name: Kemdiktisaintek Production Scheduler

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kemdiktisaintek-production-scheduler
  cancel-in-progress: false

jobs:
  dispatch-poll:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Verify production monitoring gates and dispatch one POLL
        uses: actions/github-script@v7
        env:
          SCHEDULER_ENABLED: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_SCHEDULER_ENABLED || 'false' }}
          SOURCE_ENABLED: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_ENABLED || 'false' }}
          AUTO_SEND: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_AUTO_SEND || 'false' }}
          APPROVED_MASTER_SHA: ${{ vars.KEMDIKTISAINTEK_PRODUCTION_APPROVED_CODE_SHA || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = 'Galih-Hermawan-Unikom';
            const repo = 'bima-dikti-news';
            const sha = context.sha;
            if (context.repo.owner !== owner || context.repo.repo !== repo
                || context.ref !== 'refs/heads/master'
                || !['schedule', 'workflow_dispatch'].includes(context.eventName)) {
              core.setFailed('PRODUCTION_SCHEDULER_CONTEXT_DENIED');
              return;
            }
            if (process.env.SCHEDULER_ENABLED !== 'true') {
              core.notice('PRODUCTION_SCHEDULER=OFF; no workflow dispatch');
              return;
            }
            if (process.env.SOURCE_ENABLED !== 'true'
                || process.env.AUTO_SEND !== 'false'
                || !/^[a-f0-9]{40}$/.test(sha)
                || process.env.APPROVED_MASTER_SHA !== sha) {
              core.setFailed('PRODUCTION_OBSERVATION_GATES_DENIED');
              return;
            }
            const master = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            if (master.data.object.sha !== sha) {
              core.setFailed('MASTER_HEAD_CHANGED_DURING_SCHEDULER_RUN');
              return;
            }
            const target = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: 'kemdiktisaintek-production.yml'
            });
            if (target.data.state !== 'active') {
              core.setFailed('PRODUCTION_WORKFLOW_NOT_ACTIVE');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'kemdiktisaintek-production.yml',
              ref: 'master',
              inputs: { mode: 'POLL', reviewed_code_sha: sha }
            });
            core.notice(`PRODUCTION_POLL_DISPATCH_ACK sha=${sha} mode=POLL`);
