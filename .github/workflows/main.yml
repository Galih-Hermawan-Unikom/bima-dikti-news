name: BIMA Pengumuman Checker

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-announcements:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFICATION_METHOD: ${{ vars.NOTIFICATION_METHOD || 'telegram' }}
          TELEGRAM_SEND_FILES: ${{ vars.TELEGRAM_SEND_FILES || 'false' }}
          YOUTUBE_MONITOR_ENABLED: ${{ vars.YOUTUBE_MONITOR_ENABLED || 'true' }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL || 'https://www.youtube.com/@kemdiktisaintek' }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCGo_6l_6kp8H8OHcKcSIeDw' }}
        run: |
          python run_github.py

      - name: Commit cache
        id: persist
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add announcements_cache.json
          if [ -f youtube_cache.json ]; then
            git add youtube_cache.json
          fi
          if [ -f delivery_state.json ]; then
            git add delivery_state.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update monitoring cache"
            git push
          fi

      - name: Preserve retry state if monitoring or persistence failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-recovery-${{ github.run_id }}
          path: |
            announcements_cache.json
            youtube_cache.json
            delivery_state.json
          retention-days: 14
