name: Reliability Tests
on:
  pull_request:
  push:
    branches:
      - 'fix/reliability-*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: One RSS-only cutover diagnostic without retry
        run: python -B scripts/diagnose_rss_cutover.py
      - run: playwright install --with-deps chromium
      - run: python -m pytest
