name: YouTube Live Shadow Collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-shadow-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP dependency only
        run: python -m pip install requests==2.31.0
      - name: Collect one read-only snapshot
        run: >-
          python -B youtube_shadow_live.py
          --output-dir "${RUNNER_TEMP}/youtube-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve snapshot including safe parser failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/youtube-shadow-${{ github.run_id }}-${{ github.run_attempt }}/snapshot.json
          retention-days: 14
          if-no-files-found: error
          overwrite: false
