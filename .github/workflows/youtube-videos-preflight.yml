name: YouTube Videos Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Galih-Hermawan-Unikom/bima-dikti-news'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP dependency only
        run: python -m pip install requests==2.31.0
      - name: Inspect regular videos without delivery or state writes
        run: python -B youtube_videos_preflight.py --state-dir .
